# config.yaml — 项目配置模板（包含 memory/llm 与主动消息模块配置）
# 注意：把敏感键（如 llm.api_key）放在环境变量或 secrets 中，config.yaml 仅做模板用途。

# ── 项目版本号（每次更新递增，方便宝塔面板查询当前版本状态）──
# 格式: Phase.子阶段.补丁号 (YYYY-MM-DD)
# 查看方式: cat config.yaml | head -5  或  grep "system_version" config.yaml
system_version: "v1.2.1"
system_version_date: "2026-08-22"
system_version_name: "v1.2.0 Self Understanding — 真实经历到自我理解的认知闭环"
system_version_commit: "WORKTREE_LOCAL-pending-commit"

memory:
  json_path: data/memory.json
  chroma_path: data/chroma_db
  embedding_model: all-MiniLM-L6-v2
  search_top_k: 8
  min_relevance: 0.3
  target_user_id: "366648462"
  # v1.5.5 Memory Recall Fix: 注入选择策略（semantic 优先 + recent 补足）
  injection_max_total: 6
  injection_max_semantic: 3
  # v1.6.0 M1: 时间桶内融合排序（importance 参与，防"最近闲聊挤掉重要对话"）
  selection_fusion: true
  # v1.6.0 M1: 弱时间意图（第一次/上次/当时/最近 → semantic 候选重排）
  weak_time_intent: true
  # v1.6.0 M2-1: 宽召回候选池大小（扩大 candidate pool；最终注入仍受
  # injection_max_total / injection_max_semantic 约束，不进 prompt 的 20 条）
  retrieval_broad_k: 20
  # v1.6.0 M2-2: 候选级融合评分（MemoryRelevanceEvaluator 精排 semantic/
  # recent 短名单；false=完整回退 M1 selection 排序）。与 selection_fusion/
  # weak_time_intent/retrieval_broad_k 正交。
  selection_scorer: true
  # v1.6.0 M2-3: semantic 候选去重（greedy 高分优先；只作用于 semantic
  # 阶段，不影响 history fallback / recent buckets）。与 selection_scorer 正交。
  semantic_diversity: true
  # M2-3: 相似度阈值（token Jaccard，0.85 保守——宁可漏过滤不误删）
  semantic_diversity_threshold: 0.85

llm:
  api_key: "${DEEPSEEK_API_KEY}"
  api_base: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  temperature: 0.7
  max_tokens: 4096
  # v1.4 Phase A: LLM 可靠性(读超时/重试次数; SDK 重试由代码显式控制)
  timeout_seconds: 120
  max_retries: 2

# v1.5-T3: 注入台账（prompt 组装来源字符数记账，供 L5-token 占比测量）
injection_ledger:
  enabled: true

# v1.5-T5: 关系状态按用户分桶（false=旧单例路径；迁移完成后置 true）
relationship:
  per_user_buckets: false

# v1.5.5-MC1: MC 事件桥鉴权（空=端点关闭；生产部署时生成随机 32 字符）
mc_events:
  token: ""

# 以下为主动消息（initiative）模块配置
# Phase 7.2.1-p2（2026-08-11）：单进程架构最终版。
#   - 旧版独立进程 initiative_sender.py 已删除
#   - 旧版 yuyi-sender.service 已废弃
#   - 主动消息唯一来源：api_server 进程 → RuntimeCore.tick → InitiativeEngine → InitiativeBridge → HTTP 发送
#   - Agent Server 默认由 api_server 启动（YUYI_API_SKIP_AGENT_SERVER=0），不再需要独立进程
#   - 仅部署一个服务：yuyi-api.service
initiative:
  # 总开关：true = Runtime InitiativeBridge 发送主动消息
  #         false = 完全不发送
  # v1.3 RC 0.5 (H1): 默认 false —— 旧 bridge 直发路径关闭,
  # 主动行为只经 v1.3 治理链(Proposal→Review→Drain→SafetyFilter→Budget)。
  enabled: false
  # AstrBot HTTP API 地址
  astrbot_url: "http://127.0.0.1:11451"
  # OneBot HTTP API 地址
  onebot_url: "http://127.0.0.1:3000"
  # api_type: "astrbot" | "onebot"
  api_type: "onebot"
  # OneBot Bearer Token（建议用环境变量 ONEBOT_TOKEN 覆盖）
  onebot_token: ""
  # 目标 QQ（可用环境变量 TARGET_USER_QQ 覆盖）
  target_user_qq: "366648462"
  # HTTP 请求超时时间（可用 REQUEST_TIMEOUT 环境变量覆盖，秒）
  request_timeout: 8.0

  # ── 触发间隔 & backoff（供 Runtime InitiativeEngine 参考）──
  # 最小/最大检查间隔（秒）；可用 MIN_CHECK_SECONDS / MAX_CHECK_SECONDS 环境变量覆盖
  min_check_seconds: 300
  max_check_seconds: 900
  # 连续空结果时的 backoff 倍数上限（可用 MAX_BACKOFF_MULTIPLIER 覆盖）
  max_backoff_multiplier: 4.0

  # ── 防重复发送 ──
  # 同目标用户在该秒数内不重复主动发消息（默认 60s；设为 0 关闭）
  initiative_cooldown_seconds: 60

# 远程代理（本地电脑控制）配置
# 默认关闭，启用后羽依可以连接到你的本地电脑
remote:
  # 是否启用远程代理服务
  enabled: true

  # WebSocket 监听地址和端口
  host: "0.0.0.0"
  port: 8765

  # 认证 token（本地代理需要提供相同的 token 才能连接）
  # 建议设置一个复杂的随机字符串
  auth_token: ""

  # 心跳超时（秒），超过这个时间没收到心跳则断开代理
  heartbeat_timeout: 30

# 屏幕监控配置
# 默认关闭，启用后羽依可以查看你的屏幕内容
screen:
  # 是否启用屏幕监控
  enabled: true

  # 截图超时（秒），等待本地代理返回截图的最长时间
  capture_timeout: 10

  # OCR 语言（需要安装对应的 Tesseract 语言包）
  # chi_sim = 简体中文, eng = 英文
  ocr_language: "chi_sim+eng"

  # 图片最大宽度（像素），超过则等比缩放后再传输
  max_image_width: 1920

# 电脑控制配置
# 默认关闭，启用后羽依可以操作你的键盘和鼠标
control:
  # 是否启用电脑控制
  enabled: false

  # 动作执行超时（秒）
  action_timeout: 10

  # 安全护栏
  safety_guard:
    # 是否启用快捷键拦截
    enable_keyblock: true
    # 是否启用文本输入拦截
    enable_textblock: true
    # 自定义危险文本模式（正则表达式列表）
    custom_blacklist: []

# Token 优化配置
# 默认关闭，启用后对历史消息进行压缩、对记忆进行摘要合并以减少 token 消耗
token_opt:
  # 是否启用 token 优化
  enabled: false

# === Phase 7.2 迁移新增：Runtime 总开关 ===
# 决定 /v1/chat/completions 路由走哪条路径
#   enabled=true  : 走 RuntimePipeline（推荐，享受 Lifecycle/Persistence/TokenOptimizer/Event）
#   enabled=false : 走旧链路 orchestrator.process()，秒级回滚可用
# 注意：本段为新追加,不动 llm.* / memory.* / initiative.* 任何已有 key
runtime:
  enabled: true
  adapters_enabled: true
  # Pipeline 落盘目录(新增目录,不影响旧 data/memory.json)
  persistence_dir: "data/runtime_context"
  # === Phase 3: 连续性/稳定性开关 ===
  identity_continuity_enabled: true
  identity_stability_enabled: true
  personality_stability_enabled: true
  identity_anchor_enabled: false

  # === R2.7.6 Phase4 Runtime 生产配置 ===
  # phase4_enabled=true: QQ 消息走 RuntimeController → Phase4 → DeepSeek → PersistenceManager
  # phase4_enabled=false: 走旧 Orchestrator/Pipeline（秒级回滚）
  phase4_enabled: false
  # Per-user 数据目录：data/users/<qq号>/personality/memory/relationship
  users_root_dir: "data/users"
  # LLM 引擎：deepseek（生产）| mock（测试/灰度）
  llm_engine: "deepseek"
  # 人格成长开关（关闭后所有消息不改 trait）
  growth_enabled: true
  # P0-1: approved GrowthProposal 由 Runtime 主循环消费（stage 13 每轮 + 启动兜底）
  growth_apply_drain_enabled: true
  growth_apply_drain_limit: 5
  # P0-1: 成长治理模式（true=提案镜像到治理 B-store（pending）→ 人工审批 →
  # drain 应用；false=legacy 政策自动审批/应用路径，绕过人工治理）。
  # 开启后 Step8 政策审批与 Step9 自动应用均跳过——不绕过人工 approval。
  growth_integration:
    growth_governance_enabled: true
  # P2.6 Phase C-1: self_model approved 提案消费器（approved → applied 闭环）
  # 默认关闭：开启前行为与 Phase B-1 完全一致
  self_model_drain_enabled: false
  self_model_drain_limit: 3
  # v1.3 Phase 1: goal 关注方向提案消费器（approved → GoalState active 闭环）
  # 默认关闭：开启前行为与 v1.2.1 完全一致
  goal_drain_enabled: false
  goal_drain_limit: 3
  # v1.3 Phase 2: goal 关注方向只读注入聊天理解上下文（默认关闭；
  # 开启时 GoalState 仅作理解参考，不是成长事实，不进入 Narrative）
  goal_context_enabled: false
  # v1.3 Phase 4: goal 模式检测生产接线（off=零触碰 | shadow=只产 Candidate |
  # active=桥接 PENDING 提案）。默认 off; 开启前提 integration_host_enabled=true;
  # 与 Initiative 无关, 不自动审批。
  goal_detection_mode: "off"
  # v1.3 Phase 5.2: initiative Action 执行前安全检查层（默认关闭;
  # 开启时 Action 须通过 confidence/许可/去重/冷却检查方可执行, fail-closed）
  initiative_safety_enabled: false
  # v1.3 Phase 5.4: initiative 受治理流水线（off=零触碰 |
  # shadow=GoalState→Candidate→PENDING 提案 | active=+Drain→SafetyFilter→Dispatcher）。
  # 默认 off; dispatch 另有独立开关（双 off = 不开启主动行为）;
  # 不接 Initiative 引擎骨架, 不自动批准。
  initiative_pipeline_mode: "off"
  initiative_dispatch_enabled: false
  # v1.3 Phase 5.5: initiative 可观察性（默认关闭; 开启时流水线写
  # data/initiative/initiative_actions.jsonl 审计账本, admin 只读查询）
  initiative_observability_enabled: false
  # v1.3 RC 0.5 (H2): 旧 DecisionEngine 决策路径 dispatch 门控（默认关闭;
  # 关闭=只计算+记日志, 不 dispatch 不发送; true 仅调试/迁移用）
  legacy_decision_dispatch_enabled: false
  # Memory 上下文限制：传入 prompt 的最大 memory 条数（完整 memory 仍保留在磁盘）
  max_context_memories: 25
  # 旧 data/memory.json 自动导入（仅在新用户首次对话时触发一次）
  legacy_memory_auto_import: true
  legacy_memory_path: "data/memory.json"
  # DeepSeek 配置
  deepseek:
    enabled: true
    max_retries: 3
    timeout_seconds: 30
    max_tokens: 4096
    token_budget_per_turn: 3072

  # === v1.1 认知闭环（后台生命周期, 全部默认关闭 = 行为不变）===
  # integration_host_enabled: 后台集成宿主（Reflection/Memory 整理等周期任务）
  integration_host_enabled: false
  # reflection_cycle_enabled: 反思结果 → 成长治理链（Reflection 只产分析结果）
  reflection_cycle_enabled: false
  # memory_consolidation_enabled: 记忆整理建议 → 成长治理链（整理只读, 不删不改）
  memory_consolidation_enabled: false
  # background_drain_enabled: 无聊天事件时后台消费已批准提案
  # （与 stage 13 drain 共用账本幂等, 重复执行不重复 mutation）
  background_drain_enabled: false
  # === v1.2 Self Understanding（默认全关; SHADOW=assembly 开 + injection 关）===
  # narrative_assembly_enabled: 后台组装自我叙事快照（派生视图, 不修改任何状态）
  narrative_assembly_enabled: false
  # narrative_context_injection: 聊天上下文注入叙事（false=写入 shadow 路径,
  # 聊天不可见; true=写入默认路径, 聊天可见。ACTIVE 阶段才开）
  narrative_context_injection: false

# === v1.4 Temporal B1b（默认 off = 旧行为逐字节兼容）===
temporal:
  # temporal_context_mode: off | shadow | active
  #   off    = 不生成不注入（与 v1.3 完全一致）
  #   shadow = 每轮生成 temporal_context 只写日志观测，不注入 Prompt
  #   active = 生成并注入（替换裸"当前时间"行）
  temporal_context_mode: "off"
  # temporal_context 字符预算上限（当前块实际约 90 字符，红线 400）
  temporal_context_budget: 400
  # B1c.1: 记忆时间标签（off=旧输出逐字节兼容；on=每条记忆前加 "[N天前] "，标签只来自 timestamp）
  memory_time_labels: "off"
  # B1c.3: goal aging（mode: off | shadow | active，默认 off=旧输出逐字节兼容）
  goal_aging:
    mode: "off"

# End of config.yaml
